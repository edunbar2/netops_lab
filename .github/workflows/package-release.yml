name: Package Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  source-zip:
    name: Source zip
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build source zip
        run: python tools/build_packages.py --source-only

      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: netops-labs-source
          path: dist/release/*
          if-no-files-found: error

  platform-packages:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows installer
            os: windows-latest
          - label: Linux DEB and RPM
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Install RPM build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r packaging/requirements-build.txt

      - name: Build package
        run: python tools/build_packages.py

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netops-labs-${{ runner.os }}-${{ runner.arch }}
          path: dist/release/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - source-zip
      - platform-packages
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
